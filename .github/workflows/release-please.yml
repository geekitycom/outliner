name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Parses conventional commits, maintains a release PR that bumps the
      # version (package.json, package-lock.json, and src/constants.ts via the
      # x-release-please-version annotation) and CHANGELOG.md; on merge it tags
      # the release and creates a GitHub Release. Config lives in
      # release-please-config.json and .release-please-manifest.json.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
