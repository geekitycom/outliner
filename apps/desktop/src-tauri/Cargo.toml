[package]
# "app" is tauri init's default and is kept deliberately: renaming the crate
# renames the bare executable (target/debug/app) and the lib (app_lib) that
# src/main.rs and the mobile entry point both reference. The user-visible name
# comes from productName in tauri.conf.json, not from here.
name = "app"
# Managed by release-please (see release-please-config.json) alongside
# ../package.json and ../src-tauri/tauri.conf.json. Don't edit by hand.
version = "0.2.1"
description = "GeekityFlow — a keyboard-driven OPML outliner for the desktop"
authors = ["Andrew Shell <andrew@andrewshell.org>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/geekitycom/outliner"
edition = "2021"
rust-version = "1.77.2"
# This crate is the desktop app's shell, not a library anyone should depend on,
# and "app" is a generic enough name that an accidental `cargo publish` would be
# both possible and unwelcome. The npm package in packages/outliner is the only
# thing this repo publishes.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# build.rs validates ../menu.json before the crate compiles, so a malformed or
# self-inconsistent manifest is a build failure rather than a menu item that
# renders fine and silently does nothing. Deliberately used through
# serde_json::Value rather than the crate's own MenuManifest structs — an
# independent reading of the file is the only kind that can disagree with the
# one src/lib.rs performs.
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# Percent-encodes a document path into the query string used to hand it off
# to a newly-created window — see create_document_window() in src/lib.rs.
percent-encoding = "2"

# Native window tabs (grouping windows into one tab bar) has no tao/Tauri
# API of its own — tao exposes setTabbingIdentifier only, never
# addTabbedWindow:ordered: or tabbedWindows — so grouping/ungrouping tabs
# and querying group membership goes straight through AppKit via objc2. The
# versions below are pinned to what's already resolved transitively through
# tao/wry (see Cargo.lock) so cargo unifies onto a single copy of each
# instead of building a second: two copies of objc2 would mean two
# incompatible NSWindow types between this crate and tao's.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
# "NSWindowTabGroup" is the one feature added here beyond what tab-grouping
# itself needed: it gates NSWindow::tabGroup() and the NSWindowTabGroup
# class (isTabBarVisible/toggleTabBar's own guard is just "NSWindow", but
# reading isTabBarVisible requires the tab group type) — see the "don't
# auto-hide the tab bar" design note in README.md.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSWindow",
  "NSGraphics",
  "NSWindowTabGroup",
] }
